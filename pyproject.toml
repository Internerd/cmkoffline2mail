[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmkoffline2mail"
version = "1.0.0"
description = "Benachrichtigt per SMTP, wenn Hosts in bestimmten Checkmk-Ordnern zu lange offline sind"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Internerd" }]
keywords = ["checkmk", "monitoring", "smtp", "notification", "windows"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/Internerd/cmkoffline2mail"

[project.scripts]
cmkoffline2mail = "cmkoffline2mail.cli:main"

[tool.setuptools.packages.find]
include = ["cmkoffline2mail*"]

[tool.setuptools.package-data]
cmkoffline2mail = ["py.typed"]
