# =====================================================================
# cmkoffline2mail - Hauptkonfiguration
#
# Ablageort: <Basisordner>\config\config.toml
# Der Basisordner ist frei waehlbar, z. B. C:\FIRMA\cmkoffline2mail:
#
#   C:\FIRMA\cmkoffline2mail\
#   ├─ .venv\             virtuelle Python-Umgebung
#   ├─ cmkoffline2mail\   Python-Paket
#   ├─ config\            diese Datei + mailtemplate.toml
#   ├─ data\              state.json (wird angelegt)
#   ├─ logs\              Protokoll (wird angelegt)
#   └─ deploy\            PowerShell-Skripte
#
# ALLE Pfade in dieser Datei duerfen relativ angegeben werden - sie gelten
# dann relativ zu DIESER Datei. Damit bleibt die Konfiguration unabhaengig
# vom gewaehlten Basisordner. Absolute Pfade sind ebenfalls erlaubt.
#
# Rechte: nur SYSTEM, Administratoren und das gMSA-Konto
# =====================================================================

[checkmk]
# Site-URL ohne "/check_mk" - z. B. https://cmk.example.internal/produktion
url      = "https://cmk.example.internal/produktion"
# Automationsbenutzer aus Checkmk (Setup > Users, "Automation secret")
username = "automation"

# Das Automationsgeheimnis EINE der folgenden Varianten:
secret      = "BITTE-ERSETZEN"           # a) direkt (Datei-ACL setzen!)
# secret_env  = "CMK_AUTOMATION_SECRET"  # b) aus Umgebungsvariable
# secret_file = "secret.txt"             # c) aus separater Datei (neben dieser Datei)

verify_tls = true            # false nur bei selbstsigniertem Zertifikat ohne CA-Bundle
# ca_bundle = "firmen-ca.pem" # relativ zu dieser Datei
timeout    = 30              # Sekunden pro Anfrage
retries    = 2               # Wiederholungen bei Netz-/5xx-Fehlern
# sites    = ["produktion"]  # nur diese Livestatus-Sites abfragen (leer = alle)

# Custom-Attribute der Hosts, die als Mail-Variablen zur Verfuegung stehen sollen.
# Der Name ist die ID aus Setup > Hosts > Custom host attributes (auch Labels und
# Host-Tags werden gefunden). Platzhalter heisst dann {{ attr_<name> }},
# also z. B. {{ attr_standort }} und {{ attr_ansprechpartner }}.
# Passende Namen findet man mit:  cmkoffline2mail --show-attributes HOSTNAME
custom_attributes = ["standort", "ansprechpartner"]

# true = auch am Ordner vererbte Attributwerte lesen (empfohlen)
effective_attributes = true

# Bis zu wie vielen Offline-Hosts einzeln abgefragt wird, statt alle Hosts
# auf einmal zu laden. 0 = immer die komplette Hostliste laden.
folder_lookup_threshold = 50


[behaviour]
group_by                    = "host"    # "host" = eine Mail je Host (Standard),
                                        # "folder" = eine Sammelmail je Ordner,
                                        # "single" = eine Mail fuer alle Hosts
include_unreachable         = true      # UNREACHABLE wie DOWN behandeln
skip_in_downtime            = true      # Hosts in geplanter Wartung ignorieren
skip_acknowledged           = false     # quittierte Stoerungen ignorieren
skip_notifications_disabled = true      # Hosts mit abgeschalteten Benachrichtigungen ignorieren
skip_pending                = true      # noch nie geprueft (pending) ignorieren
repeat_after                = "24h"     # Erinnerung, solange der Host offline bleibt ("off" = nur einmal)
max_hosts_per_mail          = 0         # >0 teilt grosse Listen auf mehrere Mails auf
datetime_format             = "%d.%m.%Y %H:%M"
offline_since_source        = "auto"    # auto | last_time_up | last_state_change


# ---------------------------------------------------------------------
# Ordner: je Checkmk-Ordner die Zeitspanne, ab der benachrichtigt wird.
# Pfade wie in Checkmk (Setup > Hosts), Auflistung mit --list-folders.
# Passt mehr als eine Regel, gewinnt die laengste (genaueste) Angabe.
# ---------------------------------------------------------------------
[[folders]]
path               = "/produktion"
offline_for        = "30m"          # s, m/min, h, d, w - auch "1d12h"
include_subfolders = true

[[folders]]
path               = "/produktion/aussenstellen"
offline_for        = "4h"           # gilt vorrangig vor /produktion
recipients         = ["aussendienst@example.com"]   # optional abweichende Empfaenger
subject            = "[Checkmk] Aussenstelle {{ attr_standort }}: {{ host }} offline"
repeat_after       = "12h"          # optional abweichende Erinnerung

[[folders]]
path               = "/test"
offline_for        = "7d"
enabled            = false          # Regel voruebergehend abschalten


# ---------------------------------------------------------------------
# Filter: nur benachrichtigen, wenn ein Custom-Attribut passt.
#
# Ohne [[attribute_filters]] wird jeder Host des Ordners gemeldet. Sind
# mehrere Filter angegeben, muessen ALLE zutreffen. Das Attribut wird
# automatisch mit ausgelesen, es muss nicht zusaetzlich unter
# checkmk.custom_attributes stehen.
#
# Bedingungen (mindestens eine, mehrere wirken als ODER):
#   equals    = ["Werk Nord"]     Wert ist genau einer davon
#   contains  = ["Nord"]          Wert enthaelt eine dieser Zeichenketten
#   regex     = "^Werk [0-9]+$"   Wert passt auf den regulaeren Ausdruck
#   not_empty = true              Wert ist ueberhaupt gesetzt
#
# Weitere Schalter:
#   mode        = "include"  nur bei Treffer melden (Standard)
#               = "exclude"  gerade dann NICHT melden
#   ignore_case = true       Gross-/Kleinschreibung egal (Standard)
#   on_missing  = "skip"     Attribut leer/nicht gesetzt -> nicht melden
#               = "notify"   Attribut leer -> trotzdem melden
#               (ohne Angabe: include -> skip, exclude -> notify)
# ---------------------------------------------------------------------

# Beispiel: nur Hosts melden, deren Attribut "ueberwachung" auf "24x7" steht
# [[attribute_filters]]
# attribute = "ueberwachung"
# equals    = ["24x7", "rund um die Uhr"]

# Beispiel: Testsysteme grundsaetzlich nicht melden
# [[attribute_filters]]
# attribute = "umgebung"
# contains  = ["Test", "Labor"]
# mode      = "exclude"

# Filter koennen auch nur fuer einen Ordner gelten - dann direkt unter
# den passenden [[folders]]-Abschnitt schreiben:
#
# [[folders]]
# path        = "/produktion"
# offline_for = "30m"
#
#   [[folders.attribute_filters]]
#   attribute = "kritisch"
#   equals    = ["ja"]


[mail]
from      = "checkmk@example.com"
from_name = "Checkmk Monitoring"
to        = ["it-team@example.com"]
# cc      = []
# bcc     = []
# reply_to = "servicedesk@example.com"

# Betreff mit Platzhaltern - siehe mailtemplate.example.toml fuer die Liste.
# Bei group_by = "host" beziehen sich {{ host }}, {{ ip }} und {{ attr_* }}
# direkt auf den betroffenen Host.
subject = "[Checkmk] {{ host }} ({{ ip }}) seit {{ offline_for }} offline - {{ attr_standort }}"

# Zweite Konfigurationsdatei mit dem Mailinhalt (relativ zu dieser Datei erlaubt)
template = "mailtemplate.toml"


[smtp]
host     = "smtp.example.com"
port     = 587
security = "starttls"        # none | starttls | ssl

# Nur ausfuellen, wenn der Relay eine Anmeldung verlangt. Bei einem internen
# Relay, der die IP des Servers freigibt, username/password leer lassen.
# username     = "checkmk@example.com"
# password     = "geheim"
# password_env = "CMK_SMTP_PASSWORD"
# password_file = "smtp.txt"       # relativ zu dieser Datei

timeout    = 30
verify_tls = true
# ca_bundle = "firmen-ca.pem"
# helo_name = "srv-monitor.example.internal"


[state]
# Merkt sich, wer schon benachrichtigt wurde (verhindert Mails bei jedem Lauf).
# Das gMSA-Konto braucht hier Schreibrechte.
# Ohne Angabe: <Basisordner>\data\state.json
# file = "../data/state.json"


[logging]
level        = "INFO"        # DEBUG | INFO | WARNING | ERROR
# Ohne Angabe: <Basisordner>\logs\cmkoffline2mail.log
# file       = "../logs/cmkoffline2mail.log"
max_bytes    = 5242880       # 5 MB je Datei
backup_count = 5
console      = true          # Ausgabe zusaetzlich nach stdout (Aufgabenplanung)
